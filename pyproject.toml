[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdm-concordia"
version = "2.4.0"
description = "A library for building a generative model of social interacions."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "DeepMind", email = "noreply@google.com"},
]
keywords = [
  "multi-agent",
  "agent-based-simulation",
  "generative-agents",
  "python",
  "machine-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "absl-py",
  "ipython",
  "matplotlib",
  "numpy>=1.26",
  "pandas",
  "python-dateutil",
  "reactivex",
  "tenacity",
  "termcolor",
]

[project.optional-dependencies]
amazon = ["boto3"]
dev = [
  "build",
  "isort",
  "jupyter",
  "pip-tools",
  "pyink",
  "pylint",
  "pytest-xdist",
  "pytype",
  "twine",
]
google = ["google-genai", "google-cloud-aiplatform"]
huggingface = ["accelerate", "torch", "transformers"]
langchain = ["langchain-community"]
mistralai = ["mistralai"]
ollama = ["ollama"]
openai = ["openai>=1.3.0"]
together = ["together"]
vllm = ["vllm"]
groq = ["groq"]
examples = [
  "docstring-parser",
  "immutabledict",
  "ml_collections",
  "sentence-transformers",
]

[project.urls]
Homepage = "https://github.com/google-deepmind/concordia"
Download = "https://github.com/google-deepmind/concordia/releases"

[project.scripts]
concordia-log = "concordia.command_line_interface.concordia_log:main"

[tool.isort]
profile = "google"
known_thirdparty = ["concordia"]

[tool.pip-tools]
allow_unsafe = true
generate_hashes = true
reuse_hashes = true
strip_extras = true

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]

[tool.pytest.ini_options]
required_plugins = ["pytest-xdist"]
addopts = "-n auto"
testpaths = ["concordia", "examples"]

[tool.pytype]
inputs = ["concordia", "examples"]
keep_going = true
jobs = "auto"
use_enum_overlay = true
