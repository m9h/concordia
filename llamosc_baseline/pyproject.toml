[project]
name = "llamosc-baseline"
version = "0.1.0"
description = "LLAMOSC: LLM Agent-Based Modeling for Open Source Communities - Baseline for Concordia comparison"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "langchain>=0.1.20,<0.3",
    "langchain-community>=0.0.38,<0.3",
    "langchain-core>=0.1.52,<0.3",
    "langchain-text-splitters>=0.0.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "rich>=13.0",
    "loguru>=0.7",
    "ollama>=0.4",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
docker = ["docker>=7.0"]
dev = ["pytest", "ruff"]

[project.scripts]
llamosc = "llamosc.scripts.run_llamosc:main"
llamosc-headless = "llamosc.scripts.run_headless:main"
llamosc-compare = "llamosc.scripts.compare_baseline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llamosc"]
